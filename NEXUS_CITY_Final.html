<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Smart City OS — Autonomous Urban Intelligence Platform">
    <title>NEXUS CITY — Smart City OS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        /* ── Step 1A: :root variables (LAW-CSS-01 — FULL list) ── */
        :root {
            --bg-void: #000814;
            --bg-deep: #050a14;
            --bg-panel: #0a1628;
            --bg-glass: rgba(10, 22, 40, 0.6);
            --accent-cyan: #00F5FF;
            --accent-purple: #8B5CF6;
            --accent-magenta: #FF006E;
            --accent-emerald: #10B981;
            --accent-amber: #F59E0B;
            --text-primary: #E8F4FF;
            --text-secondary: #7B9CC8;
            --text-muted: #4A6580;
            --border: 1px solid rgba(0, 245, 255, 0.12);
            --border-bright: 1px solid rgba(0, 245, 255, 0.35);
            --border-panel: 1px solid rgba(139, 92, 246, 0.2);
            --radius-sm: 4px;
            --radius-md: 8px;
            --radius-lg: 16px;
            --radius-xl: 24px;
            --radius-full: 9999px;
            --space-xs: 4px;
            --space-sm: 8px;
            --space-md: 16px;
            --space-lg: 24px;
            --space-xl: 48px;
            --space-2xl: 96px;
            --font-display: 'Orbitron', 'Share Tech Mono', monospace;
            --font-body: 'Inter', system-ui, sans-serif;
            --font-mono: 'JetBrains Mono', 'Courier New', monospace;
            --text-xs: 0.75rem;
            --text-sm: 0.875rem;
            --text-base: 1rem;
            --text-lg: 1.125rem;
            --text-xl: 1.25rem;
            --text-2xl: 1.5rem;
            --text-3xl: 2rem;
            --text-4xl: 3rem;
            --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
            --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
            --ease-in: cubic-bezier(0.4, 0, 1, 1);
            --dur-fast: 150ms;
            --dur-base: 300ms;
            --dur-slow: 600ms;
            --dur-xslow: 1200ms;
            --glass-bg: rgba(10, 22, 40, 0.6);
            --glass-blur: blur(20px);
            --glass-border: 1px solid rgba(0, 245, 255, 0.15);
            --glass-shadow: 0 8px 32px rgba(0, 0, 0, 0.37);
            --z-base: 1;
            --z-float: 10;
            --z-sticky: 100;
            --z-overlay: 1000;
            --z-modal: 2000;
            --z-toast: 3000;
            --z-cursor: 9999;
        }

        /* ── Step 1B: CSS Reset & Base Styles ── */
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html {
            scroll-behavior: smooth;
            font-size: 16px;
        }
        body {
            font-family: var(--font-body);
            background: var(--bg-void);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
            line-height: 1.6;
            transition: background 0.4s ease, color 0.4s ease;
        }
        body.light-mode {
            --bg-void: #f0f4fc;
            --bg-deep: #e6edf8;
            --bg-panel: #dce6f2;
            --bg-glass: rgba(220, 230, 242, 0.7);
            --text-primary: #0a1628;
            --text-secondary: #1a3a5c;
            --text-muted: #4a6580;
            --glass-bg: rgba(220, 230, 242, 0.7);
            --glass-border: 1px solid rgba(0, 100, 200, 0.2);
            --glass-shadow: 0 8px 32px rgba(0, 0, 0, 0.08);
            --border: 1px solid rgba(0, 100, 200, 0.15);
            --border-panel: 1px solid rgba(100, 60, 200, 0.15);
        }
        a {
            color: var(--accent-cyan);
            text-decoration: none;
        }
        a:hover {
            color: var(--accent-purple);
        }
        img,
        svg {
            display: block;
            max-width: 100%;
        }
        button {
            cursor: pointer;
            font-family: var(--font-body);
            border: none;
            background: none;
            color: inherit;
        }
        input,
        textarea,
        select {
            font-family: var(--font-body);
            color: inherit;
            background: transparent;
            border: none;
            outline: none;
        }
        ::selection {
            background: var(--accent-cyan);
            color: var(--bg-void);
        }
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg-deep);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--accent-cyan);
            border-radius: var(--radius-full);
        }

        /* ── Step 1C: Typography System ── */
        .font-display {
            font-family: var(--font-display);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .font-mono {
            font-family: var(--font-mono);
        }
        h1,
        h2,
        h3,
        h4,
        h5,
        h6 {
            font-family: var(--font-display);
            font-weight: 700;
            line-height: 1.2;
            letter-spacing: 0.04em;
        }
        h1 {
            font-size: var(--text-4xl);
        }
        h2 {
            font-size: var(--text-3xl);
        }
        h3 {
            font-size: var(--text-2xl);
        }
        h4 {
            font-size: var(--text-xl);
        }
        .text-xs {
            font-size: var(--text-xs);
        }
        .text-sm {
            font-size: var(--text-sm);
        }
        .text-base {
            font-size: var(--text-base);
        }
        .text-lg {
            font-size: var(--text-lg);
        }
        .text-xl {
            font-size: var(--text-xl);
        }
        .text-2xl {
            font-size: var(--text-2xl);
        }
        .text-3xl {
            font-size: var(--text-3xl);
        }
        .text-4xl {
            font-size: var(--text-4xl);
        }

        /* ── Step 1D: Layout Components (Glass, HUD, Cards) ── */
        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border: var(--glass-border);
            box-shadow: var(--glass-shadow), inset 0 1px 0 rgba(0, 245, 255, 0.08);
            border-radius: var(--radius-lg);
        }
        .glass-panel-light {
            background: rgba(10, 22, 40, 0.4);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(0, 245, 255, 0.08);
            border-radius: var(--radius-lg);
        }
        .hud-corner {
            position: relative;
        }
        .hud-corner::before,
        .hud-corner::after {
            content: '';
            position: absolute;
            width: 20px;
            height: 20px;
            border-color: var(--accent-cyan);
            border-style: solid;
            opacity: 0.6;
        }
        .hud-corner.tl::before {
            top: 0;
            left: 0;
            border-width: 2px 0 0 2px;
        }
        .hud-corner.tr::before {
            top: 0;
            right: 0;
            border-width: 2px 2px 0 0;
        }
        .hud-corner.bl::before {
            bottom: 0;
            left: 0;
            border-width: 0 0 2px 2px;
        }
        .hud-corner.br::before {
            bottom: 0;
            right: 0;
            border-width: 0 2px 2px 0;
        }

        .glow-cyan {
            text-shadow: 0 0 10px #00F5FF, 0 0 30px rgba(0, 245, 255, 0.5);
        }
        .glow-purple {
            text-shadow: 0 0 10px #8B5CF6, 0 0 30px rgba(139, 92, 246, 0.5);
        }
        .glow-magenta {
            text-shadow: 0 0 10px #FF006E, 0 0 30px rgba(255, 0, 110, 0.5);
        }
        .glow-emerald {
            text-shadow: 0 0 10px #10B981, 0 0 30px rgba(16, 185, 129, 0.5);
        }
        .border-glow-cyan {
            box-shadow: 0 0 15px rgba(0, 245, 255, 0.4), inset 0 0 15px rgba(0, 245, 255, 0.02);
        }
        .border-glow-purple {
            box-shadow: 0 0 15px rgba(139, 92, 246, 0.4), inset 0 0 15px rgba(139, 92, 246, 0.02);
        }
        .border-glow-emerald {
            box-shadow: 0 0 15px rgba(16, 185, 129, 0.4), inset 0 0 15px rgba(16, 185, 129, 0.02);
        }

        .card {
            background: var(--glass-bg);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border: var(--glass-border);
            border-radius: var(--radius-lg);
            padding: var(--space-lg);
            transition: transform 0.3s var(--ease-out), box-shadow 0.3s var(--ease-out);
        }
        .card:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5);
        }

        /* ── Step 1E: Navigation Styles ── */
        #main-nav {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: var(--z-sticky);
            padding: 0 var(--space-lg);
            height: 64px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: transparent;
            transition: background 0.4s ease, box-shadow 0.4s ease;
            border-bottom: var(--border);
        }
        #main-nav.scrolled {
            background: rgba(0, 8, 20, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
        }
        body.light-mode #main-nav.scrolled {
            background: rgba(240, 244, 252, 0.85);
        }
        .nav-brand {
            font-family: var(--font-display);
            font-size: var(--text-xl);
            font-weight: 900;
            color: var(--accent-cyan);
            letter-spacing: 0.08em;
            display: flex;
            align-items: center;
            gap: var(--space-sm);
            white-space: nowrap;
        }
        .nav-brand span {
            color: var(--text-primary);
        }
        .nav-links {
            display: flex;
            align-items: center;
            gap: var(--space-md);
            list-style: none;
        }
        .nav-links a {
            font-family: var(--font-display);
            font-size: var(--text-sm);
            font-weight: 500;
            color: var(--text-secondary);
            padding: var(--space-xs) var(--space-sm);
            border-radius: var(--radius-sm);
            transition: color 0.3s ease, background 0.3s ease;
            position: relative;
            text-transform: uppercase;
            letter-spacing: 0.06em;
        }
        .nav-links a:hover {
            color: var(--text-primary);
        }
        .nav-links a.active {
            color: var(--accent-cyan);
        }
        .nav-links a.active::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 50%;
            transform: translateX(-50%);
            width: 60%;
            height: 2px;
            background: var(--accent-cyan);
            box-shadow: 0 0 12px rgba(0, 245, 255, 0.6);
            border-radius: var(--radius-full);
        }
        .nav-right {
            display: flex;
            align-items: center;
            gap: var(--space-md);
        }
        .nav-btn {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: var(--text-lg);
            padding: var(--space-xs);
            border-radius: var(--radius-sm);
            transition: color 0.3s ease, background 0.3s ease;
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .nav-btn:hover {
            color: var(--text-primary);
            background: rgba(0, 245, 255, 0.08);
        }
        .nav-mobile-btn {
            display: none;
            flex-direction: column;
            gap: 4px;
            padding: var(--space-sm);
            background: none;
            border: none;
            color: var(--text-primary);
            cursor: pointer;
        }
        .nav-mobile-btn span {
            display: block;
            width: 24px;
            height: 2px;
            background: currentColor;
            border-radius: var(--radius-full);
            transition: transform 0.3s ease, opacity 0.3s ease;
        }
        .nav-mobile-btn.open span:nth-child(1) {
            transform: rotate(45deg) translate(4px, 4px);
        }
        .nav-mobile-btn.open span:nth-child(2) {
            opacity: 0;
        }
        .nav-mobile-btn.open span:nth-child(3) {
            transform: rotate(-45deg) translate(4px, -4px);
        }

        #mobile-menu {
            display: none;
            position: fixed;
            top: 64px;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 8, 20, 0.96);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            z-index: var(--z-sticky);
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: var(--space-lg);
            padding: var(--space-2xl);
        }
        #mobile-menu.open {
            display: flex;
        }
        body.light-mode #mobile-menu {
            background: rgba(240, 244, 252, 0.96);
        }
        #mobile-menu a {
            font-family: var(--font-display);
            font-size: var(--text-2xl);
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.08em;
            transition: color 0.3s ease;
        }
        #mobile-menu a:hover {
            color: var(--accent-cyan);
        }
        #mobile-menu a.active {
            color: var(--accent-cyan);
        }

        /* ── Step 1F: Preloader Styles ── */
        #preloader {
            position: fixed;
            inset: 0;
            z-index: var(--z-modal);
            background: var(--bg-void);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 0.8s ease, visibility 0.8s ease;
        }
        #preloader.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }
        #preloader .logo {
            font-family: var(--font-display);
            font-size: var(--text-4xl);
            font-weight: 900;
            color: var(--accent-cyan);
            letter-spacing: 0.12em;
            margin-bottom: var(--space-sm);
        }
        #preloader .sub {
            font-size: var(--text-sm);
            color: var(--text-secondary);
            letter-spacing: 0.1em;
            margin-bottom: var(--space-xl);
        }
        #preloader .log-container {
            width: 420px;
            max-width: 90vw;
            font-family: var(--font-mono);
            font-size: var(--text-sm);
            color: var(--text-secondary);
            text-align: left;
            line-height: 1.8;
            min-height: 160px;
        }
        #preloader .log-line {
            opacity: 0;
            transform: translateX(-8px);
            animation: logFade 0.4s var(--ease-out) forwards;
        }
        #preloader .log-line.done {
            color: var(--accent-emerald);
        }
        @keyframes logFade {
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }
        #preloader .progress-wrap {
            width: 420px;
            max-width: 90vw;
            height: 4px;
            background: rgba(0, 245, 255, 0.12);
            border-radius: var(--radius-full);
            margin-top: var(--space-md);
            overflow: hidden;
        }
        #preloader .progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--accent-cyan), var(--accent-purple));
            border-radius: var(--radius-full);
            transition: width 0.3s linear;
        }
        #preloader .enter-btn {
            margin-top: var(--space-lg);
            font-family: var(--font-display);
            font-size: var(--text-base);
            color: var(--accent-cyan);
            border: var(--border-bright);
            padding: var(--space-sm) var(--space-xl);
            border-radius: var(--radius-full);
            background: transparent;
            transition: background 0.3s ease, box-shadow 0.3s ease;
            cursor: pointer;
            opacity: 0;
            animation: logFade 0.6s var(--ease-out) 3.2s forwards;
        }
        #preloader .enter-btn:hover {
            background: rgba(0, 245, 255, 0.12);
            box-shadow: 0 0 30px rgba(0, 245, 255, 0.15);
        }

        /* Disable preloader — show site immediately */
        /* This ensures the preloader never appears and the SPA outlet is visible right away. */
        #preloader { display: none !important; opacity: 0 !important; visibility: hidden !important; pointer-events: none !important; }
        #spa-outlet { opacity: 1 !important; transform: none !important; }

        /* ── Step 1G: Page-specific Styles ── */
        #spa-outlet {
            padding-top: 64px;
            min-height: 100vh;
            transition: opacity 0.3s var(--ease-out), transform 0.3s var(--ease-out);
        }
        .page-section {
            padding: var(--space-xl) var(--space-lg);
            max-width: 1400px;
            margin: 0 auto;
        }

        /* Home Page */
        .hero-wrap {
            position: relative;
            min-height: calc(100vh - 64px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: var(--space-2xl) var(--space-lg);
        }
        #hero-canvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: var(--z-base);
            pointer-events: none;
        }
        .hero-content {
            position: relative;
            z-index: var(--z-float);
            max-width: 800px;
